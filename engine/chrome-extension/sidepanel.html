<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sinematica Flow Agent Side Panel</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <div class="panel-container">
    <!-- Header Card -->
    <div class="card header-card">
      <div class="header-main">
        <div class="app-logo" style="background: none; box-shadow: none; padding: 0; border-radius: 12px; overflow: hidden;">
          <img src="logo.png" alt="Logo" style="width: 44px; height: 44px; object-fit: cover; border-radius: 12px;" />
        </div>
        <div class="app-info">
          <h2>Flow Agent</h2>
          <p>Generate images & videos on autopilot</p>
        </div>
        <div class="toggle-container">
          <span class="status-dot" id="statusDot"></span>
          <span class="toggle-label" id="toggleLabel">OFF</span>
          <label class="switch">
            <input type="checkbox" id="autopilotToggle">
            <span class="slider round"></span>
          </label>
        </div>
      </div>
    </div>

    <!-- Metrics Cards Grid -->
    <div class="metrics-grid">
      <div class="metric-card">
        <div class="metric-value" id="metricTotal">0</div>
        <div class="metric-title">TOTAL</div>
      </div>
      <div class="metric-card">
        <div class="metric-value success-val" id="metricSuccess">0</div>
        <div class="metric-title">SUCCESS</div>
      </div>
      <div class="metric-card">
        <div class="metric-value fail-val" id="metricFailed">0</div>
        <div class="metric-title">FAILED</div>
      </div>
    </div>

    <!-- Flow Session & Credit Bar -->
    <div class="token-bar" id="sessionStatusBar">
      <div class="token-status">
        <span class="pulse-green" id="sessionPulse"></span>
        <span id="sessionStatusText">Flow Session: Ready</span>
      </div>
      <div class="points-status" id="pointsText">
        Kredit: — / ±— Video
      </div>
    </div>

    <!-- Log Section with Tabs -->
    <div class="log-section">
      <div class="log-header" style="display: flex; justify-content: space-between; align-items: center;">
        <div style="display: flex; gap: 8px;">
          <button id="tabBtnRequests" class="tab-btn active" style="border: none; background: none; font-weight: 700; font-size: 11px; color: var(--accent-purple); cursor: pointer;">REQUESTS</button>
          <button id="tabBtnAgentLogs" class="tab-btn" style="border: none; background: none; font-weight: 700; font-size: 11px; color: var(--text-sub); cursor: pointer;">AGENT LOGS</button>
        </div>
        <span class="log-badge" id="logCountBadge">0</span>
      </div>

      <!-- Requests Table View -->
      <div class="table-container" id="requestsView">
        <table class="log-table">
          <thead>
            <tr>
              <th>ID</th>
              <th>TYPE</th>
              <th>TIME</th>
              <th>STATUS</th>
              <th>ERROR</th>
            </tr>
          </thead>
          <tbody id="logTableBody">
            <!-- Empty state when no logs -->
          </tbody>
        </table>
        <div class="empty-log-state" id="emptyLogState">
          <div class="empty-icon">📋</div>
          <p>No requests yet</p>
        </div>
      </div>

      <!-- Agent Terminal View -->
      <div class="table-container" id="agentLogsView" style="display: none; background: #0f172a; border-radius: 10px; padding: 8px; font-family: monospace; font-size: 11px; color: #e2e8f0; max-height: 220px; overflow-y: auto;">
        <div id="agentLogsContainer" style="display: flex; flex-direction: column; gap: 4px;">
          <!-- Real-time structured agent logs -->
        </div>
      </div>
    </div>

    <!-- Footer Action Buttons -->
    <div class="footer-actions">
      <button class="btn-purple" id="btnOpenFlowTab">Open Flow Tab</button>
      <button class="btn-glass" id="btnSyncSession">Sync Flow Tab</button>
    </div>
  </div>

  <script src="flow-logger.js"></script>
  <script src="sidepanel.js"></script>
</body>
</html>
